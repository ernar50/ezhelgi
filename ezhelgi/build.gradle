// Мод «Ежелгі Қазақстан» для Minecraft 26.3 / Forge 66.0.12
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'kz.ezhelgi'

base {
    archivesName = 'ezhelgi-kazakhstan-26.3'
}

// Minecraft 26.x работает на Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.12')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
